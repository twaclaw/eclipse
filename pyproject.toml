[project]
name = "earth-simulations"
version = "0.1.0"
description = "Animations of the Earth-Moon-Sun system for marimo notebooks"
requires-python = ">=3.13"
dependencies = [
    "anywidget>=0.11.0",
    "marimo>=0.23.16",
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earthsim"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
